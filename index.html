/* מחברת מנסרות · פלטת LevCatom הסגורה על נייר קרם (ערכת צבע אחת, בכוונה).
   Pogo לכותרות, Rubik לגוף ולמספרים. צבע בשרטוט תמיד מלווה במילה בטבלת החישוב. */
:root{
  --cream:#FBF5ED;--coral:#E76F51;--sand:#F4A261;--gold:#E9C46A;--teal:#2A9D8F;--navy:#264653;--brown:#5A2A0C;--beige:#E6D3B9;
  --paper:#FFFDF9;--gold-t:#FBF0D3;--teal-t:#E3F2F0;--coral-t:#FBE4DD;--sand-t:#FCE9D6;--line:#D9CDBA;
  --body:"Rubik",Arial,sans-serif;--display:"SKF Pogo","Rubik",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--cream);color:var(--navy);font-family:var(--body);line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{max-width:780px;margin:0 auto;padding-block:0 96px}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.m sub{font-size:.7em;font-weight:400;unicode-bidi:isolate}
.m.mh{direction:rtl}

/* סרגל עליון */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1.5px solid var(--beige);margin-bottom:22px}
.top .home{font-family:var(--display);font-size:1.35rem;color:var(--coral);text-decoration:none;padding:2px 4px}
.top .sp{flex:1;min-width:0;font-size:.85rem;color:var(--brown);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;border:1.5px solid var(--beige);background:var(--paper);border-radius:99px;padding:4px 14px;font-size:.86rem;min-height:38px;text-decoration:none}
.tbtn:hover{border-color:var(--navy)}
.play{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--navy);color:var(--cream);border-radius:99px;padding:6px 18px;min-height:42px;font-weight:500;text-decoration:none}
.play:hover{background:var(--brown)}
.play.big{font-size:1.05rem;padding:8px 24px;min-height:48px;justify-self:start}

/* פתיחה */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:center;padding-block:4px 10px}
.hero-t{display:grid;gap:14px;min-width:0}
.eyebrow{font-size:.82rem;font-weight:500;letter-spacing:.02em;color:var(--teal)}
.hero h1{font-family:var(--display);font-size:clamp(3rem,12vw,5rem);line-height:.95;color:var(--coral)}
.lead{font-size:1.08rem;max-width:40ch}
.hero-fig{min-width:0;touch-action:pan-y;cursor:grab}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero-fig{order:-1;max-width:340px;justify-self:center;width:100%}}

.bh{font-family:var(--display);font-size:1.5rem;margin-block:6px 0}
.map{display:grid;gap:12px;margin-top:22px}
.secs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sec{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1.5px solid var(--beige);border-radius:16px;padding:10px 14px;text-decoration:none;min-height:64px}
.sec:hover{border-color:var(--navy)}
.sn{width:38px;height:38px;border-radius:50%;background:var(--gold-t);display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;color:var(--brown)}
.st{display:grid;min-width:0;line-height:1.35}
.st small{color:var(--brown);font-size:.84rem}
.prog{display:grid;justify-items:end;gap:2px}
.prog .bar{width:70px;height:7px;border-radius:9px;background:var(--beige);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--teal);border-radius:9px}
.prog small{font-size:.75rem;color:var(--brown);font-variant-numeric:tabular-nums}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec.x{grid-template-columns:auto 1fr}
.sec.x .sn{background:var(--teal-t);color:var(--teal)}
@media (max-width:560px){.extras{grid-template-columns:1fr}}
.howto{margin-top:26px;background:var(--teal-t);border-radius:18px;padding:16px 18px;display:grid;gap:8px;justify-items:start}
.howto h2{font-family:var(--display);font-size:1.35rem}
.howto ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}

</style></head><body><div id="app"></div><script>// מנוע גאומטריה ושרטוט למנסרות ישרות. שרטוט SVG בסגנון ספר לימוד:
// פאות גלויות ממולאות, מקצועות נסתרים מקווקווים, תוויות מספרים על המקצועות.
// מערכת צירים: x,y אופקיים, z למעלה. הבסיס הוא מצולע נגד כיוון השעון במישור z=0.
const Geo = (() => {
  const fmt = (x) => {
    if (typeof x === 'string') return x;
    const r = Math.round(x * 100) / 100;
    return String(Object.is(r, -0) ? 0 : r);
  };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const unit = (a) => mul(a, 1 / (len(a) || 1));
  const rot = (v, u, ang) => { // סיבוב רודריגז סביב ציר יחידה u
    const c = Math.cos(ang), s = Math.sin(ang);
    return add(add(mul(v, c), mul(cross(u, v), s)), mul(u, dot(u, v) * (1 - c)));
  };

  // ---- הבסיס ----
  const NAMES = { box: 'תיבה', cube: 'קובייה', rtri: 'מנסרה משולשת (ישרת זווית)', iso: 'מנסרה משולשת (שווה שוקיים)', eq: 'מנסרה משולשת (שווה צלעות)', trap: 'מנסרה שבסיסה טרפז', hex: 'מנסרה משושה' };
  function base(spec) {
    const k = spec.k; let pts, lab, area, extra = [];
    if (k === 'box' || k === 'cube') {
      const a = spec.a, b = k === 'cube' ? spec.a : spec.b;
      pts = [[0, 0], [a, 0], [a, b], [0, b]]; lab = [a, b, null, null]; area = a * b;
    } else if (k === 'rtri') {
      const a = spec.a, b = spec.b;
      pts = [[0, 0], [a, 0], [0, b]]; lab = [a, spec.showC ? Math.hypot(a, b) : null, b]; area = a * b / 2;
      extra.push({ type: 'right', at: [0, 0, 0], u: [1, 0, 0], v: [0, 1, 0] });
    } else if (k === 'iso') {
      const s = spec.s, l = spec.l, hh = Math.sqrt(l * l - s * s / 4);
      pts = [[0, 0], [s, 0], [s / 2, hh]]; lab = [s, l, null]; area = s * hh / 2;
      if (spec.showTH) extra.push({ type: 'seg', a: [s / 2, 0, 0], b: [s / 2, hh, 0], cls: 'ov-aux', lab: spec.showTH === true ? fmt(hh) : spec.showTH });
    } else if (k === 'eq') {
      const s = spec.s;
      pts = [[0, 0], [s, 0], [s / 2, s * Math.sqrt(3) / 2]]; lab = [s, null, null]; area = s * s * Math.sqrt(3) / 4;
    } else if (k === 'trap') {
      const a = spec.a, b = spec.b, th = spec.th, off = (a - b) / 2;
      pts = [[0, 0], [a, 0], [a - off, th], [off, th]]; lab = [a, spec.showLeg ? Math.hypot(off, th) : null, b, null]; area = (a + b) / 2 * th;
      if (spec.showTH !== false) extra.push({ type: 'seg', a: [a - off, 0, 0], b: [a - off, th, 0], cls: 'ov-aux', lab: fmt(th) });
    } else if (k === 'hex') {
      const s = spec.s;
      pts = Array.from({ length: 6 }, (_, i) => [s * Math.cos(i * Math.PI / 3 - Math.PI * 2 / 3), s * Math.sin(i * Math.PI / 3 - Math.PI * 2 / 3)]);
      lab = [s, null, null, null, null, null]; area = 3 * Math.sqrt(3) / 2 * s * s;
    } else throw new Error('סוג לא מוכר ' + k);
    if (spec.lab) lab = lab.map((v, i) => (spec.lab[i] === undefined ? v : spec.lab[i]));
    let per = 0;
    for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; per += Math.hypot(q[0] - p[0], q[1] - p[1]); }

  }

  function info(spec) {
    const B = base(spec);
    return { name: NAMES[spec.k], n: B.n, area: B.area, per: B.per, h: B.h, lateral: B.per * B.h, total: B.per * B.h + 2 * B.area, vol: B.area * B.h, faces: B.n + 2, edges: 3 * B.n, verts: 2 * B.n };
  }

  // ---- מודל תלת־ממדי ----
  // מחזיר פאות (רשימות נקודות) ומידע על מקצועות. t=0 מנסרה סגורה, t=1 פריסה שטוחה.
  function build(spec, t = 0, f0 = 0) {
    const B = base(spec), n = B.n, h = B.h;
    // מסדרים את המצולע כך שהפאה הקבועה בפריסה היא צלע 0
    const P2 = B.pts.slice(f0).concat(B.pts.slice(0, f0));
    const lab = B.lab.slice(f0).concat(B.lab.slice(0, f0));
    const cx = B.pts.reduce((s, p) => s + p[0], 0) / n, cy = B.pts.reduce((s, p) => s + p[1], 0) / n;
    const C = [cx, cy, h / 2];
    const P = P2.map(([x, y]) => [x - cx, y - cy]);
    const zb = -h / 2, zt = h / 2;
    const faces = [];
    if (!t) {
      const V = P.map(([x, y]) => [x, y, zb]).concat(P.map(([x, y]) => [x, y, zt]));
      faces.push({ kind: 'base', ids: P.map((_, i) => n - 1 - i) });
      faces.push({ kind: 'base', ids: P.map((_, i) => n + i) });
      for (let i = 0; i < n; i++) { const j = (i + 1) % n; faces.push({ kind: 'side', idx: i, ids: [i, j, n + j, n + i] }); }
      faces.forEach((f) => { f.pts = f.ids.map((id) => V[id]); });
      return { V, faces, n, h, C, lab, B, solid: true };
    }
    // פריסה: שרשרת הפאות הצדדיות נפתחת, הבסיסים מסתובבים סביב הצלע של פאה 0
    const ang = [], L = [];
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ang.push(Math.atan2(q[1] - p[1], q[0] - p[0])); L.push(Math.hypot(q[0] - p[0], q[1] - p[1])); }

    for (let i = 0; i < n; i++) { const psi = ang[0] + (1 - t) * (cum[i] - ang[0]); const last = Q[i]; Q.push([last[0] + L[i] * Math.cos(psi), last[1] + L[i] * Math.sin(psi)]); }
    for (let i = 0; i < n; i++) faces.push({ kind: 'side', idx: i, pts: [[Q[i][0], Q[i][1], zb], [Q[i + 1][0], Q[i + 1][1], zb], [Q[i + 1][0], Q[i + 1][1], zt], [Q[i][0], Q[i][1], zt]], w: L[i], wl: lab[i] });

    const hinge = (z, sgn) => P.map(([x, y]) => add(rot(sub([x, y, z], [P[0][0], P[0][1], z]), u, sgn * t * Math.PI / 2), [P[0][0], P[0][1], z]));
    faces.push({ kind: 'base', pts: hinge(zb, -1), bl: true });
    faces.push({ kind: 'base', pts: hinge(zt, 1), bl: true });

  }

  // ---- הטלה ----
  function camera(yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    return {
      p(v) { const x1 = v[0] * cy - v[1] * sy, y1 = v[0] * sy + v[1] * cy, z1 = v[2]; return [x1, y1 * sp + z1 * cp, -y1 * cp + z1 * sp]; },
      toward(nrm) { const y1 = nrm[0] * sy + nrm[1] * cy; return -y1 * cp + nrm[2] * sp; },
    };
  }
  const lie = (v) => [v[0], -v[2], v[1]];

  function pill(x, y, text, cls = '') {
    const t = String(text), w = Math.max(18, t.length * 8.2 + 10);
    return `<g class="lab ${cls}"><rect x="${(x - w / 2).toFixed(1)}" y="${(y - 11).toFixed(1)}" width="${w.toFixed(1)}" height="22" rx="11"/><text x="${x.toFixed(1)}" y="${(y + 5).toFixed(1)}" text-anchor="middle">${t}</text></g>`;
  }
  const poly = (pts, cls, extra = '') => `<polygon class="${cls}" points="${pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"${extra}/>`;
  const line = (a, b, cls) => `<line class="${cls}" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;

  // radius: רדיוס קבוע לקנה מידה (כדי שהשרטוט לא "יקפוץ" בזמן סיבוב)
  function radiusOf(spec, opts = {}) {
    const m0 = build(spec, 0);
    let R = Math.max(...m0.V.map(len));
    if (opts.unfold) {
      const m1 = build(spec, 1, opts.f0 || 0);

      const mn = [0, 1, 2].map((i) => Math.min(...all.map((p) => p[i]))), mx = [0, 1, 2].map((i) => Math.max(...all.map((p) => p[i])));
      const c = mn.map((v, i) => (v + mx[i]) / 2);

    }
    return { R, c: [0, 0, 0] };
  }

  // ---- שרטוט ----

    let h = 0;
    const success = () => {
      fb.className = 'fb good'; fb.innerHTML = `<b>${PRAISE[Math.floor(Math.random() * PRAISE.length)]}</b> ${it.mc ? '' : `התשובה: ${m(f(it.ans))} ${it.unit}`}`;
      box.classList.add('ok');
      if (!it.gen) { P[it.id] = 'ok'; save(); const hd = $('.ex-h', box); if (!$('.done', hd)) hd.insertAdjacentHTML('beforeend', '<span class="done">✓ נפתר</span>'); }
      onOk && onOk();
    };
    if (it.mc) {
      $$('.opt', box).forEach((b) => b.addEventListener('click', () => {
        const i = +b.dataset.i;
        $$('.opt', box).forEach((x) => x.classList.remove('picked-bad'));
        if (i === it.mc.correct) { b.classList.add('picked-good'); success(); $('.steps', box).hidden = false; }
        else { b.classList.add('picked-bad'); fb.className = 'fb bad'; fb.textContent = 'לא בדיוק. נסי אפשרות אחרת, או קחי רמז.'; }
      }));
    } else {
      const inp = $('input', box);
      const go = () => {
        const x = parse(inp.value);
        if (Number.isNaN(x)) { fb.className = 'fb'; fb.textContent = 'כתבי מספר בתיבה ואז "בדיקה".'; return; }
        const r = judge(it, x);
        if (r.ok) success(); else { fb.className = 'fb bad'; fb.innerHTML = r.msg; box.classList.remove('ok'); }
      };
      $('.go', box).addEventListener('click', go);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    }
    const hb = $('.hint', box);
    hb.addEventListener('click', () => {
      if (h >= it.hints.length) return;
      hints.insertAdjacentHTML('beforeend', `<li>${it.hints[h++]}</li>`);
      hb.textContent = h >= it.hints.length ? 'אין עוד רמזים' : 'רמז נוסף';
      hb.disabled = h >= it.hints.length;
    });
    $('.sol', box).addEventListener('click', (e) => { const s = $('.steps', box); s.hidden = !s.hidden; e.currentTarget.textContent = s.hidden ? 'פתרון מלא' : 'להסתיר פתרון'; });
    const fig = $('.exfig.rot', box);
    if (fig && it.fig) {
      const st = { yaw: it.fig.view?.yaw ?? Geo.defYaw(it.fig.spec), pitch: it.fig.view?.pitch ?? 0.42 };
      rotatable(fig, st, () => { fig.innerHTML = Geo.svg(it.fig.spec, { W: 360, H: 250, ...(it.fig.view || {}), yaw: st.yaw, pitch: st.pitch }); });
    }
  }

  // מחולל "עוד תרגיל"
  function mountGen(el, keys, opts = {}) {
    let key = keys[0], streak = 0;
    el.innerHTML = `<div class="gen-h"><h2>${opts.title || 'עוד תרגיל'}</h2>${opts.random ? '' : keys.length > 1 ? chips('סוג תרגיל', keys.map((k) => [k, Items.GEN[k].name]), key) : `<span class="tag">${Items.GEN[key].name}</span>`}</div>
      <p class="cap">${opts.cap || 'מספרים חדשים בכל פעם. אפשר לתרגל כמה שרוצים.'}</p><div class="slot"></div>
      <div class="gen-f"><button type="button" class="play next">תרגיל חדש</button><span class="streak" aria-live="polite"></span></div>`;
    const slot = $('.slot', el), sk = $('.streak', el);
    const fresh = () => {
      const k = opts.random ? keys[Math.floor(Math.random() * keys.length)] : key;
      const it = Items.gen(k);
      slot.innerHTML = exHTML(it, 0, {});
      const tag = opts.random ? `<span class="tag">${Items.GEN[k].name}</span>` : '';
      $('.ex-h', slot).innerHTML = tag;
      mountEx($('.ex', slot), it, () => { streak++; sk.textContent = streak === 1 ? 'פתרת תרגיל אחד.' : `פתרת ${streak} תרגילים.`; });
    };
    if (keys.length > 1 && !opts.random) onChips(el, '.chips', (v) => { key = v; fresh(); });
    $('.next', el).addEventListener('click', fresh);
    fresh();
    return { setKeys(ks) { keys = ks; fresh(); } };
  }

  // ---------- בלוקים ----------
  function blockHTML(b, ctx) {
    switch (b.t) {
      case 'p': return `<p class="read">${b.html}</p>`;
      case 'h': return `<h2 class="bh">${b.text}</h2>`;
      case 'box': return `<div class="box">${b.html}</div>`;
      case 'terms': return `<dl class="terms ${b.cls || ''}">${b.rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
      case 'rule': return `<div class="rule">${b.rows.map(([k, v, d]) => `<div class="r"><span class="rk">${k}</span><span class="rv">${v}</span>${d ? `<span class="rd">${d}</span>` : ''}</div>`).join('')}</div>`;
      case 'viewer': return `<div class="viewer" data-kind="${b.kind}" data-angle="${b.angle ? 1 : 0}"></div>`;
      case 'worked': return `<div class="worked"><div class="wk-h"><span class="tag t-w">${b.title}</span></div><p class="ex-q">${b.q}</p><figure class="exfig">${Geo.svg(b.fig.spec, { W: 360, H: 240, ...(b.fig.view || {}) })}</figure>
        <ol class="wsteps">${b.steps.map((s, i) => `<li${i ? ' hidden' : ''}>${s}</li>`).join('')}</ol><div class="wk-f"><button type="button" class="play wnext">הצעד הבא</button><button type="button" class="tbtn wall">להראות הכול</button></div></div>`;
      case 'ex': return `<h2 class="bh">תרגול</h2><div class="exs">${b.ids.map((id) => exHTML(Items.byId[id], ++ctx.n)).join('')}</div>`;
      case 'group': {
        const it0 = Items.byId[b.ids[0]];
        return `<section class="group"><h2 class="bh">${b.title}</h2><div class="stem"><p>${b.stem}</p>${figOf(it0)}</div><div class="exs">${b.ids.map((id) => exHTML(Items.byId[id], 0, { part: true, noFig: true })).join('')}</div></section>`;
      }
      case 'gen': return `<div class="gen" data-keys="${b.keys.join(',')}"></div>`;
      default: return '';
    }
  }
  function mountBlocks(root) {
    $$('.viewer', root).forEach((v) => {
      const k = v.dataset.kind;
      if (k === 'explore') mountExplore(v); else if (k === 'net') mountNet(v); else if (k === 'layers') mountLayers(v); else if (k === 'diag') mountDiag(v, v.dataset.angle === '1');
    });
    $$('.ex', root).forEach((box) => { const it = Items.byId[box.dataset.id]; if (it) mountEx(box, it); });
    $$('.group', root).forEach((g) => {
      const fig = $('.stem .exfig.rot', g), it = Items.byId[$('.ex', g).dataset.id];
      if (fig) { const st = { yaw: it.fig.view?.yaw ?? Geo.defYaw(it.fig.spec), pitch: it.fig.view?.pitch ?? 0.42 }; rotatable(fig, st, () => { fig.innerHTML = Geo.svg(it.fig.spec, { W: 360, H: 250, ...(it.fig.view || {}), yaw: st.yaw, pitch: st.pitch }); }); }
    });
    $$('.gen', root).forEach((g) => mountGen(g, g.dataset.keys.split(',')));
    $$('.worked', root).forEach((w) => {
      const lis = $$('.wsteps li', w), nx = $('.wnext', w), al = $('.wall', w);
      const upd = () => { const left = lis.filter((l) => l.hidden).length; nx.disabled = !left; al.hidden = !left; nx.textContent = left ? 'הצעד הבא' : 'זהו, סיימנו'; };
      nx.addEventListener('click', () => { const l = lis.find((x) => x.hidden); if (l) l.hidden = false; upd(); });
      al.addEventListener('click', () => { lis.forEach((l) => { l.hidden = false; }); upd(); });
      upd();
    });
  }

  // ---------- עמודים ----------
  const topbar = (title) => `<div class="top"><a class="home" href="#home">מנסרות</a><span class="sp">${title || ''}</span><a class="tbtn" href="#formulas">נוסחאות</a></div>`;
  const dots = (s) => { const p = secProg(s); return `<span class="prog" aria-label="${p.done} מתוך ${p.all} תרגילים נפתרו"><span class="bar"><i style="width:${p.all ? (p.done / p.all) * 100 : 0}%"></i></span><small>${p.done}/${p.all}</small></span>`; };
  function home() {
    app.innerHTML = `${topbar('')}
      <header class="hero"><div class="hero-t"><p class="eyebrow">מתמטיקה · 3 יחידות · גאומטריה במרחב</p><h1>מנסרות</h1>
        <p class="lead">שטח, שטח פנים, נפח, אלכסונים וזוויות. שבעה פרקים קצרים, וכל אחד מתחיל במשהו שאפשר לסובב, לפתוח או למלא.</p>
        <a class="play big" href="#${firstOpen()}">${Object.keys(P).length ? 'להמשיך מאיפה שעצרתי' : 'מתחילים'}</a></div>
        <div class="hero-fig" aria-label="מנסרה משושה שמסתובבת"></div></header>
      <section class="map"><h2 class="bh">הפרקים</h2><ol class="secs">${SECS.map((s) => `<li><a class="sec" href="#${s.id}"><span class="sn">${s.code}</span><span class="st"><b>${s.title}</b><small>${s.goal}</small></span>${dots(s)}</a></li>`).join('')}</ol>
        <div class="extras"><a class="sec x" href="#mix"><span class="sn">∞</span><span class="st"><b>תרגול בלי סוף</b><small>תרגילים מעורבים עם מספרים חדשים בכל פעם.</small></span></a><a class="sec x" href="#formulas"><span class="sn">✎</span><span class="st"><b>דף נוסחאות</b><small>כל הנוסחאות של המנסרה במקום אחד.</small></span></a></div></section>
      <section class="howto"><h2>איך עובדים עם המחברת</h2><ul>
        <li>מחשבון מותר וכדאי. אם התשובה לא שלמה, עגלי לשתי ספרות אחרי הנקודה.</li>
        <li>בכל תרגיל יש <b>רמז</b> ו<b>פתרון מלא</b>. רמז הוא לא רמאות, הוא חלק מהלמידה.</li>
        <li>כשהתשובה לא נכונה, המחברת מנסה לנחש מה קרה ולהגיד את זה. טעות היא מידע.</li>
        <li>אפשר לסובב כל שרטוט תלת־ממדי בגרירה, או בחיצים במקלדת.</li>
        <li>ההתקדמות נשמרת בדפדפן הזה בלבד.</li></ul>
        <button type="button" class="tbtn reset">לאפס את ההתקדמות</button><span class="rs-q" hidden> בטוח? <button type="button" class="tbtn rs-yes">כן, לאפס</button></span></section>`;
    mountHero($('.hero-fig', app));
    $('.reset', app).addEventListener('click', () => { $('.rs-q', app).hidden = false; });
    $('.rs-yes', app).addEventListener('click', () => { P = {}; save(); route(); });
  }
  const firstOpen = () => { const s = SECS.find((x) => { const p = secProg(x); return p.done < p.all; }); return s ? s.id : 'mix'; };
  function section(s) {
    const i = SECS.indexOf(s), prev = SECS[i - 1], next = SECS[i + 1];
    const ctx = { n: 0 };
    app.innerHTML = `${topbar(`פרק ${s.code} · ${s.title}`)}
      <div class="sec-h"><span class="c">פרק ${s.code} מתוך ${SECS.length}</span><h1>${s.title}</h1><p class="goal"><b>המטרה:</b> ${s.goal}</p></div>
      <div class="blocks">${s.blocks.map((b) => blockHTML(b, ctx)).join('')}</div>
      <nav class="pn">${prev ? `<a class="tbtn" href="#${prev.id}">→ ${prev.title}</a>` : '<span></span>'}${next ? `<a class="play" href="#${next.id}">${next.title} ←</a>` : '<a class="play" href="#mix">תרגול בלי סוף ←</a>'}</nav>`;
    mountBlocks(app);
  }
  function mix() {
    const keys = Object.keys(Items.GEN);
    app.innerHTML = `${topbar('תרגול בלי סוף')}<div class="sec-h"><span class="c">תרגול</span><h1>תרגול בלי סוף</h1><p class="goal"><b>איך:</b> בחרי נושאים, והמחברת תערבב ביניהם. מספרים חדשים בכל פעם.</p></div>
      <div class="pickers">${keys.map((k) => `<label class="ck"><input type="checkbox" value="${k}" checked> ${Items.GEN[k].name}</label>`).join('')}</div><div class="gen mixg"></div>`;
    const g = mountGen($('.mixg', app), keys, { random: true, title: 'תרגיל', cap: 'כל תרגיל נבחר באקראי מתוך הנושאים שסימנת.' });
    $$('.pickers input', app).forEach((c) => c.addEventListener('change', () => {
      let ks = $$('.pickers input', app).filter((x) => x.checked).map((x) => x.value);
      if (!ks.length) { c.checked = true; ks = [c.value]; }
      g.setKeys(ks);
    }));
  }
  function formulas() {
    app.innerHTML = `${topbar('דף נוסחאות')}<div class="sec-h"><span class="c">סיכום</span><h1>דף נוסחאות</h1><p class="goal">כל מה שצריך למנסרה ישרה. ${m('P')} = היקף הבסיס, ${m('h')} = גובה המנסרה.</p></div>
      <div class="blocks">
      <h2 class="bh">שטחי בסיסים</h2>${blockHTML(SECS[1].blocks[1], {})}
      <h2 class="bh">מנסרה</h2><div class="rule"><div class="r"><span class="rk">שטח המעטפת</span><span class="rv">${m('M = P · h')}</span></div><div class="r"><span class="rk">שטח הפנים</span><span class="rv">${m('S = M + 2 · S<sub>בסיס</sub>')}</span></div><div class="r"><span class="rk">נפח</span><span class="rv">${m('V = S<sub>בסיס</sub> · h')}</span></div><div class="r"><span class="rk">גובה מתוך נפח</span><span class="rv">${m('h = V : S<sub>בסיס</sub>')}</span></div></div>
      <h2 class="bh">תיבה במידות a, b, c</h2><div class="rule"><div class="r"><span class="rk">נפח</span><span class="rv">${m('V = a · b · c')}</span></div><div class="r"><span class="rk">שטח פנים</span><span class="rv">${m('S = 2ab + 2ac + 2bc')}</span></div><div class="r"><span class="rk">אלכסון הבסיס</span><span class="rv">${m('d² = a² + b²')}</span></div><div class="r"><span class="rk">אלכסון התיבה</span><span class="rv">${m('D² = a² + b² + c²')}</span></div><div class="r"><span class="rk">זווית אלכסון–בסיס</span><span class="rv">${m('tan α = c : d')}</span></div></div>
      <h2 class="bh">קובייה במקצוע a</h2><div class="rule"><div class="r"><span class="rk">נפח</span><span class="rv">${m('V = a³')}</span></div><div class="r"><span class="rk">שטח פנים</span><span class="rv">${m('S = 6a²')}</span></div></div>
      <h2 class="bh">טריגונומטריה במשולש ישר זווית</h2>${blockHTML(SECS[5].blocks[3], {})}
      <h2 class="bh">יחידות</h2><div class="box">${m('1 ליטר = 1000 סמ"ק')} · ${m('1 מ"ק = 1000 ליטר')} · ${m('1 מ"ר = 10000 סמ"ר')}</div></div>`;
  }
  function route() {
    cleanup.forEach((fn) => fn()); cleanup = [];
    const id = (location.hash || '#home').slice(1);
    const s = SECS.find((x) => x.id === id);
    if (s) section(s); else if (id === 'mix') mix(); else if (id === 'formulas') formulas(); else home();
    window.scrollTo(0, 0);
    const h1 = $('h1', app); if (h1 && id !== 'home' && location.hash) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); }
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script></body></html>
